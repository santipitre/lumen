<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Atención temprana">
<meta name="theme-color" content="#070D1F">
<meta name="robots" content="noindex, nofollow">
<title>Atención temprana · Lumen</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="atencion-temprana.css?v=4c5cac45">
</head>
<body>

<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#1d3a5f"/><path d="M13 9v20h13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="27" cy="12" r="4.2" fill="#c8962e"/></svg>
    <div><div class="t1">Atención temprana</div><div class="t2">Lumen · Diagnóstico por Imágenes</div></div>
  </div>
  <div class="spacer"></div>
  <div class="clock" id="clock"></div>
  <div class="mode" id="modeBadge"></div>
</header>

<main>
  <section class="search card" id="searchCard" aria-label="Búsqueda por documento">
    <div class="lbl" id="dniLbl">Documento del paciente</div>
    <div class="dni" id="dni" role="textbox" aria-readonly="true" aria-labelledby="dniLbl"></div>
    <div class="keypad" id="keypad">
      <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
      <button class="key aux" data-k="clear" aria-label="Borrar todo">Borrar</button>
      <button class="key" data-k="0">0</button>
      <button class="key aux" data-k="back" aria-label="Borrar último dígito">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M14 9.5l5 5M19 9.5l-5 5"/></svg>
      </button>
    </div>
    <button class="go" id="btnBuscar" disabled>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      Buscar
    </button>
    <button class="scan" id="btnScan" hidden>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M7 12h10"/></svg>
      Escanear código del DNI
    </button>
    <div class="chips" id="demoChips" hidden></div>
  </section>

  <section class="results" id="results" aria-live="polite"></section>
</main>

<div class="ov" id="pedidoOv" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pedidoTitle">
    <header>
      <h3 id="pedidoTitle">Pedido médico</h3>
      <a class="btn ghost" id="pedidoOpen" target="_blank" rel="noopener noreferrer" style="min-height:48px;font-size:16px">Abrir en otra pestaña</a>
      <button class="btn primary" id="pedidoClose" style="min-height:48px;font-size:16px">Cerrar</button>
    </header>
    <div class="body" id="pedidoBody"></div>
  </div>
</div>

<div class="ov" id="scanOv" hidden>
  <div class="scanwrap">
    <video id="scanVideo" playsinline muted></video>
    <div class="guide"></div>
    <div class="cap">Apuntá al código de barras del dorso del DNI</div>
    <button class="btn primary" id="scanCancel">Cancelar</button>
  </div>
</div>

<script src="atencion-temprana.js?v=0c0d6461"></script>
</body>
</html>
