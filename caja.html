<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caja · Listados y tesorería</title>
<style>
:root{
  /* --- identidad (NUNCA usar para estado) --- */
  --oro:#876800; --oro-2:#DDBF75;
  /* --- superficies: papel cálido, tinta pizarra fría --- */
  --ink:#2C303C; --ink-2:#5A6275; --ink-3:#5F677E;
  --paper:#F3F0E9; --panel:#FCFBF8; --linea:#E5E0D5; --linea-2:#F0EDE5;
  --fondo:#F3F0E9;
  --btn-fg:#FCFBF8;
  --sombra:0 1px 2px rgba(44,48,60,.05),0 8px 22px rgba(44,48,60,.06);
  /* --- categorías: gama armonizada en OKLCH.
         *-bg / *-soft son pastel (rellenos); el token pelado es TEXTO y
         mantiene >=4.55:1 contra papel, panel y filas teñidas. --- */
  --efectivo:#127B4E;  --efectivo-bg:#DEF4E6;  --efectivo-soft:#85CDA3;
  --tarjeta:#5465B4;   --tarjeta-bg:#E6EDFF;   --tarjeta-soft:#A5B7F8;
  --billetera:#8F5598; --billetera-bg:#F8E8FA; --billetera-soft:#D8A6DF;
  --otros:#9E5735;     --otros-bg:#FFE8DE;     --otros-soft:#EEA788;
  --alerta:#B14648;    --alerta-bg:#FFE6E5;    --alerta-soft:#F2A29F;
  --aviso:#985D00;     --aviso-bg:#FBEBD9;     --aviso-soft:#E2B076;
  /* --- filas teñidas y ticket --- */
  --fila-ok:#E9F7EF; --fila-ok-h:#DCF0E5;
  --fila-ret:#F8F2E0; --fila-ret-h:#F2E9CE;
  --cinta:#FDFCF6;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono","DejaVu Sans Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --marca:#2F5B8E; --marca-2:#1F3D63;
  --r:6px;
}
body.gated nav.tabs,body.gated .shell,body.gated #ro-banda{display:none}
#gate{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;background:var(--fondo);padding:24px}
#gate.on{display:flex}
.gate-box{width:100%;max-width:408px;border:1px solid var(--linea);border-radius:16px;padding:0;background:var(--panel);overflow:hidden;box-shadow:0 24px 64px rgba(44,48,60,.14)}
.gate-top{padding:34px 32px 30px;border-bottom:1px solid var(--linea-2)}
.gate-marca{display:flex;align-items:center;gap:13px;margin-bottom:26px}
.gate-marca svg{display:block;flex:none}
.gate-wordmark{font-size:21px;font-weight:700;letter-spacing:.13em;color:var(--ink);line-height:1}
.gate-kicker{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--oro);text-transform:uppercase}
.gate-t{font-size:23px;margin:11px 0 10px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.gate-p{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin:0 0 22px}
.gate-p strong{color:var(--ink);font-weight:600}
#gate-form,#gate-form2{display:flex;flex-direction:column;gap:11px}
.gate-lab{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--ink-3);text-transform:uppercase;margin-bottom:-3px}
#gate-mail{width:100%;padding:12px 14px;border-radius:9px;border:1px solid var(--linea);background:var(--paper);color:var(--ink);font-size:14.5px;font-family:inherit;transition:border-color .15s}
#gate-mail:hover,#gate-code:hover{border-color:var(--ink-3)}
#gate-mail:focus,#gate-code:focus{outline:none;border-color:var(--oro);box-shadow:0 0 0 3px rgba(135,104,0,.18)}
#gate-code{width:100%;padding:15px 13px;border-radius:9px;border:1px solid var(--linea);background:var(--paper);color:var(--oro);font-family:var(--mono);font-size:27px;font-weight:700;letter-spacing:.26em;text-indent:.26em;text-align:center;transition:border-color .15s}
#gate-code::placeholder{color:var(--linea);font-weight:700}
#gate-btn,#gate-btn2{padding:12px;border-radius:9px;font-size:14.5px;font-weight:600;letter-spacing:.01em}
#gate-btn:disabled,#gate-btn2:disabled{opacity:.55;cursor:default}
.gate-link{background:none;border:0;color:var(--ink-3);font-size:12.5px;font-family:inherit;cursor:pointer;padding:4px 0;transition:color .15s}
.gate-link:hover{color:var(--oro)}
.gate-hint{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin:15px 0 0;min-height:17px}
.gate-hint.err{color:var(--alerta)}
.gate-hint.ok{color:var(--efectivo)}
.gate-pie{padding:15px 32px;background:var(--paper);display:flex;align-items:center;justify-content:center;gap:9px}
.gate-pie span{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase;text-align:center;line-height:1.5}
.gate-pie i{width:3px;height:3px;border-radius:50%;background:var(--linea);flex:none}
#ro-banda{display:none;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-align:center;padding:6px 10px;background:var(--aviso-bg);color:var(--aviso);border-bottom:1px solid var(--linea)}
body.ro #ro-banda{display:block}
body.cargando .shell,body.cargando nav.tabs{opacity:.35;pointer-events:none}
@media print{#gate,#ro-banda{display:none!important}}
*{box-sizing:border-box}
html{color-scheme:light}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.48;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-0.015em}
.shell{display:grid;grid-template-columns:minmax(0,1fr) 272px;gap:20px;max-width:1500px;margin:0 auto;padding:0 20px 60px}
@media(max-width:1120px){.shell{grid-template-columns:minmax(0,1fr)}.cinta-wrap{position:static!important}}
header.top{border-bottom:1px solid var(--linea);border-top:3px solid var(--oro-2);background:var(--panel)}
.top-in{align-items:center!important}
.escudo{width:100%;max-width:1900px;height:auto;border:0;border-radius:0;display:none}
.escudo.on{display:block}
/* --- encabezado tipográfico: logos reales + titular en texto.
       Antes era un PNG rasterizado (bitmap del texto) -> se veía lavado.
       Si el usuario sube su propio encabezado, .marca se oculta y vuelve #escudo. --- */
.marca{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;
  gap:clamp(14px,3.5vw,52px);width:100%;max-width:1500px;margin:0 auto;padding:16px 20px 18px}
.marca-logo{height:clamp(50px,6.4vw,78px);width:auto;display:block}
.marca-logo.hi{height:clamp(58px,7.4vw,90px)}
.marca-mid{display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0}
.marca-mid h1{font-size:clamp(23px,4.6vw,48px);line-height:1;font-weight:800;letter-spacing:-.022em;
  text-transform:uppercase;color:var(--ink);white-space:nowrap;display:flex;gap:.3em;margin:0}
.marca-mid h1 em{font-style:normal;color:var(--marca)}
.marca-sede{font-family:var(--mono);font-size:clamp(9.5px,1.1vw,12px);letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.filete{width:min(100%,680px);height:2.5px;flex:none;position:relative;
  background:linear-gradient(90deg,transparent,var(--oro-2) 14%,var(--oro-2) 86%,transparent)}
.filete.d::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;
  transform:translate(-50%,-50%) rotate(45deg);background:var(--oro-2)}
@media(max-width:760px){
  .marca{grid-template-columns:auto auto;justify-content:center;gap:18px;padding:14px 16px}
  .marca-mid{grid-column:1/-1;order:-1}
  .marca-logo{height:44px}
  .marca-logo.hi{height:50px}
}
.top-in{max-width:none;margin:0 auto;padding:0;display:flex;flex-direction:column;align-items:center;position:relative}
.brand{font-size:16px;font-weight:700;letter-spacing:-0.02em;color:var(--oro)}
.brand span{color:var(--ink-3);font-weight:450}
.top-fecha{width:100%;max-width:1500px;margin:0 auto;padding:7px 20px 0;display:flex;justify-content:flex-end}
.top-right{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.04em;
  background:var(--linea-2);border:1px solid var(--linea);padding:3px 11px;border-radius:99px}
@media(max-width:760px){.top-fecha{justify-content:center;padding-top:10px}}
nav.tabs{display:flex;gap:2px;max-width:1500px;margin:0 auto 20px;padding:0 20px;flex-wrap:wrap;border-bottom:1px solid var(--linea)}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:11px 15px;cursor:pointer;color:var(--ink-2);font-weight:600;font-size:15px;margin-bottom:-1px}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-current=true]{color:var(--oro);border-bottom-color:var(--oro);font-weight:650}
nav.tabs button:focus-visible{outline:2px solid var(--tarjeta);outline-offset:-2px}
.panel{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);padding:18px;box-shadow:var(--sombra)}
.panel+.panel{margin-top:16px}
.panel>h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:650;margin-bottom:14px;padding-left:9px;border-left:2px solid var(--oro-2)}
.hint{color:var(--ink-3);font-size:13.5px;margin:0 0 14px}
.cinta-wrap{position:sticky;top:16px}
.cinta{background:var(--cinta);border:1px solid var(--linea);border-bottom:0;border-radius:var(--r) var(--r) 0 0;padding:18px 18px 22px;position:relative}
.cinta::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-11px;height:12px;
  background:linear-gradient(-45deg,transparent 50%,var(--cinta) 50%) 0 0/12px 12px repeat-x,linear-gradient(45deg,transparent 50%,var(--cinta) 50%) 0 0/12px 12px repeat-x;
  filter:drop-shadow(0 1px 0 var(--linea))}
.cinta-eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.cinta-monto{font-family:var(--mono);font-size:33px;font-weight:600;letter-spacing:-.03em;margin:6px 0 2px;font-variant-numeric:tabular-nums;color:var(--efectivo)}
.cinta-sub{font-size:13px;color:var(--ink-2)}
.cinta-rows{margin-top:16px;border-top:1px dashed var(--linea);padding-top:12px;display:grid;gap:7px}
.cr{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.cr span{color:var(--ink-2)}.cr b{font-weight:600}
.cinta-actions{margin-top:34px;display:grid;gap:8px}
.btn{background:#3A4152;color:var(--btn-fg);border:1px solid #3A4152;padding:9px 15px;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:14.5px;transition:background .15s,border-color .15s}
.btn:hover{background:#2C303C;border-color:#2C303C}.btn:focus-visible{outline:2px solid var(--tarjeta);outline-offset:2px}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--linea)}
.btn.ghost:hover{background:var(--linea-2)}
.btn.danger{background:var(--alerta);border-color:var(--alerta);color:#FFF6F5}
.btn.small{padding:6px 11px;font-size:13.5px;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label.f{display:grid;gap:5px;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
input[type=text],input[type=date],select,textarea{background:var(--linea-2);border:1px solid var(--linea);border-radius:var(--r);padding:7px 9px;color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input[type=date]{color-scheme:light}
input:focus,select:focus,textarea:focus{outline:2px solid var(--tarjeta);outline-offset:-1px;border-color:var(--tarjeta)}
input.money{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;width:116px;padding-left:24px}
.money-wrap{position:relative;display:inline-block}
.money-wrap::before{content:"$";position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-family:var(--mono);pointer-events:none;line-height:1}
.money-wrap:focus-within::before{color:var(--efectivo)}
.drop{border:2px dashed var(--linea);border-radius:var(--r);padding:34px 20px;text-align:center;background:var(--linea-2);transition:.15s}
.drop.hot{border-color:var(--efectivo);background:var(--efectivo-bg)}
.drop.mini{padding:16px 14px;cursor:pointer}
.drop.mini b{font-size:14px;margin-bottom:2px}
.drop.falta{border-color:var(--alerta);background:var(--alerta-bg)}
.err-campo{color:var(--alerta);font-size:12.5px;margin:8px 0 0;font-weight:600}
.drop b{display:block;font-size:16px;margin-bottom:5px}
.drop small{color:var(--ink-3)}
.tabla-scroll{overflow:auto;max-height:64vh;border:1px solid var(--linea);border-radius:var(--r);background:var(--panel)}
table.data{width:100%;border-collapse:collapse;font-size:14.5px}
table.data thead th{position:sticky;top:0;background:var(--linea-2);z-index:2;text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--linea);white-space:nowrap}
table.data td{padding:9px 12px;border-bottom:1px solid var(--linea-2);white-space:nowrap}
table.data tbody tr:hover td{background:var(--linea-2)}
table.data td.num,table.data th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-weight:600;letter-spacing:-.01em}
tr.fila-retiro td{background:var(--fila-ret);color:var(--ink);font-weight:600}
tr.fila-retiro td:first-child{box-shadow:inset 3px 0 0 var(--oro-2)}
tr.fila-retiro:hover td{background:var(--fila-ret-h)}
tr.detalle td{background:var(--linea-2);font-size:13.5px;color:var(--ink-2)}
tr.dia-sep td{background:var(--panel);border-top:2px solid var(--oro-2);border-bottom:1px solid var(--linea);padding:9px 10px 7px;white-space:normal}
tr.dia-sep:first-child td{border-top:0}
tr.dia-sep:hover td{background:var(--panel)}
.dsep{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}
.dsep-f{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink)}
.dsep-f::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--oro-2);flex:none}
.dsep-m{display:flex;align-items:baseline;gap:18px;font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.dsep-m b{color:var(--ink-2);font-weight:650}
.dsep-m .ret{color:var(--otros)}
.badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:1px 6px;border-radius:9px;text-transform:uppercase}
.badge.rev{background:var(--alerta-bg);color:var(--alerta)}
.badge.info{background:var(--aviso-bg);color:var(--aviso)}
.badge.ok{background:var(--efectivo-bg);color:var(--efectivo)}
tr.fila-ok td{background:var(--fila-ok)}
tr.fila-ok:hover td{background:var(--fila-ok-h)}
.comp-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--linea);border-radius:99px;padding:1px 4px 1px 9px;font-size:11.5px;font-family:var(--mono);margin:1px 3px 1px 0;max-width:180px}
.comp-chip a{color:var(--tarjeta);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.comp-chip button{background:none;border:0;color:var(--ink-3);cursor:pointer;padding:0 4px;font-size:13px}
.comp-chip button:hover{color:var(--alerta)}
.cajero-tag{font-family:var(--mono);font-size:13.5px;font-weight:700;letter-spacing:.02em}
.chip-ef{color:var(--efectivo)} .chip-ta{color:var(--tarjeta)} .chip-bi{color:var(--billetera)} .chip-ot{color:var(--otros)}
.neg{color:var(--alerta)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:var(--r);overflow:hidden;box-shadow:var(--sombra)}
.kpi{background:var(--panel);padding:13px 14px}
.kpi .k{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:650}
.kpi .v{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:3px}
.bars{display:grid;gap:9px;margin-top:6px}
.bar-row{display:grid;grid-template-columns:112px 1fr 128px;gap:10px;align-items:center;font-size:12.5px}
.bar-track{height:16px;background:var(--linea-2);border-radius:99px;overflow:hidden;overflow:hidden;display:flex}
.leyenda{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-bottom:10px;flex-wrap:wrap}
.leyenda i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.bar-val{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.banner{border-radius:var(--r);padding:11px 14px;font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.banner.rojo{background:var(--alerta-bg);border:1px solid var(--alerta-soft);color:var(--alerta)}
.banner.ambar{background:var(--aviso-bg);border:1px solid var(--aviso-soft);color:var(--aviso)}
.banner.verde{background:var(--efectivo-bg);border:1px solid var(--efectivo-soft);color:var(--efectivo)}
.banner .btn{margin-left:auto}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(140%);background:var(--ink);color:var(--btn-fg);padding:11px 18px;border-radius:var(--r);font-size:13.5px;font-weight:500;transition:transform .22s ease;z-index:99;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
dialog{border:1px solid var(--linea);border-radius:var(--r);padding:0;max-width:min(760px,95vw);width:100%;background:var(--panel);color:var(--ink);box-shadow:0 18px 60px rgba(44,48,60,.18)}
dialog::backdrop{background:rgba(44,48,60,.34)}
dialog .dlg-h{padding:16px 18px 0}
dialog .dlg-b{padding:14px 18px}
dialog .dlg-f{padding:14px 18px;border-top:1px solid var(--linea);display:flex;gap:8px;justify-content:flex-end;background:var(--linea-2);flex-wrap:wrap}
dialog.dlg-confirm{max-width:min(460px,94vw)}
dialog.dlg-confirm::backdrop{background:rgba(44,48,60,.26)}
dialog.dlg-confirm{max-width:min(500px,94vw);overflow:hidden;position:relative}
dialog.dlg-confirm::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--aviso),transparent)}
dialog.dlg-confirm.peligro::before{background:linear-gradient(90deg,transparent,var(--alerta),transparent)}
dialog.dlg-confirm .dlg-h{padding:26px 26px 0;display:block}
dialog.dlg-confirm .dlg-kicker{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;
  text-transform:uppercase;color:var(--aviso);margin-bottom:9px;display:flex;align-items:center;gap:9px}
dialog.dlg-confirm.peligro .dlg-kicker{color:var(--alerta)}
dialog.dlg-confirm .dlg-kicker::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,currentColor,transparent);opacity:.35}
dialog.dlg-confirm .dlg-h h2{font-size:20px;margin:0;line-height:1.25;letter-spacing:.2px;font-weight:600}
dialog.dlg-confirm .dlg-b{padding:13px 26px 6px;font-size:14px;line-height:1.62;color:var(--ink-2)}
dialog.dlg-confirm .dlg-b p{margin:0 0 9px}
dialog.dlg-confirm .dlg-b p:last-child{margin-bottom:0}
dialog.dlg-confirm .dlg-f{padding:20px 26px 22px;justify-content:flex-end;background:transparent;border-top:0}
.dlg-campo{margin-top:16px;padding-top:15px;border-top:1px solid var(--linea)}
.dlg-campo label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);font-family:var(--mono);margin-bottom:7px}
.dlg-campo textarea{width:100%;min-height:76px;resize:vertical;padding:10px 12px;border-radius:8px;
  border:1px solid var(--linea);background:var(--fondo);color:var(--ink);
  font-family:inherit;font-size:13.5px;line-height:1.5}
.dlg-campo textarea:focus{outline:2px solid var(--aviso);outline-offset:1px}
.dlg-campo .err{color:var(--alerta);font-size:12px;margin:7px 0 0;min-height:15px}
.vacio{padding:34px 10px;text-align:center;color:var(--ink-3);font-size:13.5px}
.vacio b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:5px;font-weight:600}
/* ============================================================

const SUPABASE_URL = 'https://erjdncsnomwymjiaslpx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_5qeVvqQO26a70lAj8dMXhw_fL_Cdu-2';
(function(){
  if (window.sbAuth) return;
  const sdk = window.supabase;
  if (!sdk || typeof sdk.createClient !== 'function') return;
  try{
    window.sbAuth = sdk.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth:{ autoRefreshToken:true, persistSession:true, detectSessionInUrl:true,
             storage:window.localStorage, storageKey:'spcd_supabase_auth', flowType:'implicit' }});
  }catch(e){ console.warn('[caja] sbAuth', e); }
})();
async function getSBHeaders(){
  let token = SUPABASE_KEY;
  try{
    if(window.sbAuth && window.sbAuth.auth){
      const {data}=await window.sbAuth.auth.getSession();
      if(data && data.session && data.session.access_token) token=data.session.access_token;
    }
  }catch(e){}
  return {apikey:SUPABASE_KEY,'Authorization':'Bearer '+token,
          'Content-Type':'application/json','Prefer':'return=representation'};
}
async function sbQuery(t,p=''){const r=await fetch(`${SUPABASE_URL}/rest/v1/${t}?${p}`,{headers:await getSBHeaders()});
  if(!r.ok)throw new Error('DB '+r.status); return r.json();}
async function sbInsert(t,d){const r=await fetch(`${SUPABASE_URL}/rest/v1/${t}`,{method:'POST',headers:await getSBHeaders(),body:JSON.stringify(d)});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.message||'Insert '+r.status)} return r.json();}
async function sbRpc(fn,args){const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:await getSBHeaders(),body:JSON.stringify(args)});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.message||'RPC '+r.status)} return r.json();}

/* ============================================================
   NUBE — sesión, sede y permisos
   ============================================================ */
const SEDE="Sede Hospital Italiano";
const SEDE_SLUG="sede-hospital-italiano";
const BUCKET="caja-comprobantes";
let USUARIO=null, NIVEL=null, AUTHUID=null;
const puedeEditar=()=>NIVEL==="edit"||NIVEL==="admin";
const esAdmin=()=>NIVEL==="admin";

async function sbDel(tabla,filtro){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${tabla}?${filtro}`,{method:"DELETE",headers:await getSBHeaders()});
  if(!r.ok) throw new Error("Borrado "+r.status);
}
async function stSubir(path,blob){
  const h=await getSBHeaders();
  const r=await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${encodeURI(path)}`,
    {method:"POST",headers:{apikey:h.apikey,Authorization:h.Authorization},body:blob});
  if(!r.ok) throw new Error("No se pudo subir el archivo ("+r.status+")");
}
async function stBorrar(path){
  const h=await getSBHeaders();
  await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${encodeURI(path)}`,
    {method:"DELETE",headers:{apikey:h.apikey,Authorization:h.Authorization}}).catch(()=>{});
}
async function stFirmar(path){
  const r=await fetch(`${SUPABASE_URL}/storage/v1/object/sign/${BUCKET}/${encodeURI(path)}`,
    {method:"POST",headers:await getSBHeaders(),body:JSON.stringify({expiresIn:3600})});
  if(!r.ok) throw new Error("No se pudo abrir el comprobante ("+r.status+")");
  const j=await r.json();
  return SUPABASE_URL+"/storage/v1"+j.signedURL;
}

  const tareas=[];
  const dif=(coll,snap,fila,tabla)=>{

    const nuevos=coll.filter(x=>!snap.has(x.id));
    const fuera=[...snap].filter(id=>!ahora.has(id));

    if(fuera.length)  tareas.push(sbDel(tabla,enLista(fuera)));
  };
  dif(db.grupos,SNAP.grupos,filaGrupo,"caja_grupos");
  dif(db.retiros,SNAP.retiros,filaRetiro,"caja_retiros");
  dif(db.importaciones,SNAP.importaciones,filaImport,"caja_importaciones");

  const rvAhora=new Set(Object.keys(db.revisados));

    const v=db.revisados[k];
    return {sede:SEDE,fecha:v.fecha,cajero:v.cajero,nota:v.nota||null,revisado_por:AUTHUID};
  })));
  for(const k of rvFuera){

    tareas.push(sbDel("caja_revisados",`sede=eq.${encodeURIComponent(SEDE)}&fecha=eq.${f}&cajero=eq.${encodeURIComponent(c)}`));

const nf0=new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",minimumFractionDigits:0,maximumFractionDigits:0});
const nf2=new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",minimumFractionDigits:2,maximumFractionDigits:2});
const plata=n=>(Math.abs((n||0)%1)>.004?nf2:nf0).format(n||0);
const numero=n=>new Intl.NumberFormat("es-AR").format(n||0);
function parseMonto(t){
  if(typeof t==="number")return t; if(!t)return 0;
  let s=String(t).trim().replace(/\s|\$|ARS/gi,""); if(!s)return 0;
  const neg=/^-/.test(s)||/\)$/.test(s); s=s.replace(/[-()]/g,"");
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  else if((s.match(/\./g)||[]).length>1) s=s.replace(/\./g,"");
  else if(s.includes(".")){const[a,b]=s.split(".");if(b.length===3)s=a+b}
  const n=parseFloat(s); if(!isFinite(n))return 0; return neg?-n:n;
}
const hoyISO=()=>new Date().toLocaleDateString("sv-SE");
const fechaCorta=i=>i?i.split("-").reverse().join("/"):"";
const fechaLarga=i=>i?new Date(i+"T12:00:00").toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}):"";
function parseFecha(v){
  if(v instanceof Date&&!isNaN(v)) return new Date(Date.UTC(v.getUTCFullYear(),v.getUTCMonth(),v.getUTCDate())).toISOString().slice(0,10);
  if(typeof v==="number"&&v>20000&&v<80000){ // serial de Excel
    const d=new Date(Date.UTC(1899,11,30)+v*864e5);
    return d.toISOString().slice(0,10);
  }
  const s=String(v||"").trim(); if(!s)return null;
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){let a=m[3];if(a.length===2)a=(+a>70?"19":"20")+a;return `${a}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`}
  return null;
}

function totales(gr){
  const t={efectivo:0,tarjeta:0,billetera:0,otros:0,total:0,n:0,comps:0};
  for(const g of gr){t[g.categoria]+=g.monto;t.total+=g.monto;t.n++;t.comps+=g.n||0}
  return t;
}
function porDia(gr){
  const m=new Map();
  for(const g of gr){
    const k=g.fecha+"|"+g.cajero;
    if(!m.has(k))m.set(k,{fecha:g.fecha,cajero:g.cajero,efectivo:0,tarjeta:0,billetera:0,otros:0,total:0,comps:0,grupos:[]});
    const o=m.get(k); o[g.categoria]+=g.monto; o.total+=g.monto; o.comps+=g.n||0; o.grupos.push(g);
  }
  return [...m.values()].sort((a,b)=>a.fecha===b.fecha?a.cajero.localeCompare(b.cajero):a.fecha.localeCompare(b.fecha));
}

function anomaliasDia(d){
  const out=[]; const hoy=hoyISO();
  if(d.fecha>hoy) out.push("Fecha futura");
  if(d.fecha<"2020-01-01") out.push("Fecha imposible");
  if(!db.cajeros.includes(d.cajero)) out.push("Cajero fuera de la lista");
  if(d.efectivo<0) out.push("Efectivo neto negativo");
  if(d.otros!==0) out.push("Valores fuera de efectivo, tarjeta y billetera");
  const origenes=new Set(d.grupos.map(g=>g.imp||"—"));
  if(origenes.size>1) out.push("Cargado desde dos orígenes distintos");
  return out;
}

   Reemplazan a confirm() y alert() del navegador. Usan su propio
   <dialog>, así se pueden abrir encima de un modal ya abierto.
   ============================================================ */
function _dlg2({titulo,texto,acciones,peligro,kicker,campo}){
  return new Promise(resolve=>{
    const d=$("#dlg2");
    d.classList.toggle("peligro",!!peligro);
    $("#dlg2-t").parentElement.replaceChildren(
      el("div",{class:"dlg-kicker"},kicker||(peligro?"Acci\u00f3n irreversible":"Confirmaci\u00f3n")),
      el("h2",{id:"dlg2-t"},titulo));

    const cuerpo=$("#dlg2-b"); cuerpo.replaceChildren();
    for(const t of (Array.isArray(texto)?texto:[texto])) cuerpo.append(el("p",{},t));

    let ta=null, err=null;
    if(campo){
      ta=el("textarea",{placeholder:campo.ejemplo||"",rows:"3",maxlength:"400"});
      err=el("p",{class:"err"});
      cuerpo.append(el("div",{class:"dlg-campo"},
        el("label",{},campo.etiqueta),ta,err));
    }

    const f=$("#dlg2-f"); f.replaceChildren();
    let resuelto=false;
    const cerrar=v=>{if(resuelto)return;resuelto=true;d.close();resolve(v)};
    for(const a of acciones){
      f.append(el("button",{class:"btn "+(a.clase||"ghost"),type:"button",onclick:()=>{
        if(a.valor&&campo){
          const v=ta.value.trim();
          if(v.length<(campo.minimo||1)){
            err.textContent=campo.error||"Escrib\u00ed una observaci\u00f3n.";
            ta.focus(); return;
          }
          cerrar(v); return;
        }
        cerrar(a.valor);
      }},a.texto));
    }
    d.addEventListener("close",()=>cerrar(false),{once:true});
    d.showModal();
    if(ta) ta.focus();
    else { const b=f.querySelector("button:last-child"); if(b)b.focus(); }
  });
}

/* --- lectura y normalización ------------------------------- */
const COLS={
  fecha:["fecha","f/ comprobante","fecha comprobante"],
  cajero:["cajero","operador","usuario"],
  medio:["medio cancelación","medio cancelacion","medio de cancelación","medio","forma de pago"],
  monto:["monto","importe"],
  total:["total"],
  letra:["letra"], numero:["numero","número","nro","n° comprobante"], tc:["tc","tipo comprobante"],
  anulada:["anulada"]
};
function mapear(cab){
  const norm=cab.map(h=>String(h||"").toLowerCase().replace(/\s+/g," ").trim());
  const idx={};
  for(const[campo,alias]of Object.entries(COLS)){
    idx[campo]=norm.findIndex(h=>alias.some(a=>h===a));
    if(idx[campo]<0) idx[campo]=norm.findIndex(h=>alias.some(a=>h.includes(a)));
  }
  return idx;
}
function leerArchivos(files){
  const pendientes=[]; let leidos=0;
  for(const f of files){
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const wb=XLSX.read(new Uint8Array(fr.result),{type:"array",cellDates:false});
        const hoja=wb.Sheets[wb.SheetNames[0]];
        const filas=XLSX.utils.sheet_to_json(hoja,{header:1,raw:true,defval:""});
        pendientes.push({nombre:f.name,filas});
      }catch(e){ toast(`No se pudo leer ${f.name}: ${e.message}`); }
      if(++leidos===files.length) procesar(pendientes);
    };
    fr.onerror=()=>{ toast(`No se pudo abrir ${f.name}.`); if(++leidos===files.length) procesar(pendientes); };
    fr.readAsArrayBuffer(f);
  }
}
function procesar(archivos){
  if(!archivos.length){toast("Ningún archivo legible.");return}
  const grupos=new Map(); const rechazos=[]; let filasOK=0; const nombres=[];
  const medios=new Set();

  for(const a of archivos){
    nombres.push(a.nombre);
    // encontrar la fila de cabecera
    let hi=-1, idx=null;
    for(let i=0;i<Math.min(a.filas.length,12);i++){
      const m=mapear(a.filas[i]);
      if(m.fecha>=0&&m.cajero>=0&&(m.monto>=0||m.total>=0)){hi=i;idx=m;break}
    }
    if(hi<0){ rechazos.push({archivo:a.nombre,linea:1,motivo:"no encontré las columnas Fecha / Cajero / Monto"}); continue; }

    for(let i=hi+1;i<a.filas.length;i++){
      const r=a.filas[i]; if(!r||!r.length)continue;
      const f=parseFecha(r[idx.fecha]);
      const cj=String(r[idx.cajero]||"").trim().toUpperCase();
      if(!f||!cj){ if(r.some(v=>String(v).trim())) rechazos.push({archivo:a.nombre,linea:i+1,motivo:!f?"fecha ilegible":"sin cajero"}); continue; }
      if(idx.anulada>=0&&String(r[idx.anulada]||"").trim()){ rechazos.push({archivo:a.nombre,linea:i+1,motivo:"comprobante anulado"}); continue; }
      const monto=parseMonto(idx.monto>=0?r[idx.monto]:r[idx.total]);
      const medio=normMedio(idx.medio>=0?r[idx.medio]:"");
      medios.add(medio);
      const nro=idx.numero>=0?String(r[idx.numero]||"").replace(/\.0$/,""):"";
      const k=[f,cj,medio].join("|");
      if(!grupos.has(k)) grupos.set(k,{fecha:f,cajero:cj,medio,categoria:categoriaDe(medio),monto:0,n:0,comps:[]});
      const g=grupos.get(k); g.monto+=monto; g.n++; if(g.comps.length<400)g.comps.push({n:nro||"",m:monto});
      filasOK++;
    }
  }
  if(!grupos.size){
    modal({titulo:"No se importó nada",cuerpo:el("div",{},
      el("p",{},"No pude leer ninguna fila válida."),
      rechazos.length?el("p",{class:"hint"},`Ejemplo: ${rechazos[0].archivo}, línea ${rechazos[0].linea} — ${rechazos[0].motivo}.`):null,
      el("p",{class:"hint"},"Verificá que el archivo sea la exportación a Excel del Listado de Caja, no el PDF.")
    ),acciones:[{texto:"Cerrar"}]});
    return;
  }
  previsualizar([...grupos.values()],rechazos,nombres,filasOK,[...medios]);
}

function previsualizar(nuevos,rechazos,nombres,filasOK,medios){

  const t=totales(nuevos);

    el("th",{class:"num"},"Otros"),el("th",{class:"num"},"Total"))));

  for(const d of dias) tb.append(el("tr",{},

    el("td",{class:"num chip-ef"},plata(d.efectivo)), el("td",{class:"num chip-ta"},plata(d.tarjeta)),

    el("td",{class:"num",style:"font-weight:600"},plata(d.total))));
  tab.append(tb);

  const cuerpo=el("div",{},
    el("div",{class:"kpis",style:"margin-bottom:14px"},
      kpi("Comprobantes",numero(filasOK)),
      kpi("Efectivo",plata(t.efectivo),"var(--efectivo)"),

    el("p",{class:"hint",style:"margin:0 0 12px"},`${nombres.length} archivo(s) · ${rango} · ${dias.length} combinación(es) día + cajero`),
    cajerosNuevos.length?el("div",{class:"banner ambar"},el("b",{},"Cajeros nuevos: "),cajerosNuevos.join(", ")):null,

    rechazos.length?el("div",{class:"banner ambar"},el("b",{},`${rechazos.length} fila(s) descartadas`),`ej. ${rechazos[0].archivo} línea ${rechazos[0].linea}: ${rechazos[0].motivo}`):null,
    el("div",{class:"tabla-scroll",style:"max-height:300px"},tab)
  );

  const commit=(reemplazar)=>{
    const impId=uid();
    if(reemplazar){
      const claves=new Set(dias.map(d=>d.fecha+"|"+d.cajero));
      db.grupos=db.grupos.filter(g=>!claves.has(g.fecha+"|"+g.cajero));
    }
    for(const c of cajerosNuevos) db.cajeros.push(c);
    for(const g of nuevos) db.grupos.push({id:uid(),imp:impId,...g});
    db.importaciones.push({id:impId,archivo:nombres.join(", "),cuando:Date.now(),filas:filasOK,total:t.total,rango});

  };
  const acciones=[{texto:"Cancelar"}];
  if(yaExisten.length) acciones.push({texto:"Importar igual (duplica)",accion:()=>commit(false)});
  acciones.push({texto:yaExisten.length?"Reemplazar esos días":`Importar ${filasOK} comprobantes`,clase:"",accion:()=>commit(!!yaExisten.length)});
  modal({titulo:"Previsualizar importación",cuerpo,acciones});
}

function verComps(g){

function vistaRetiros(){
  const c=el("div",{}); const p=el("div",{class:"panel"});
  p.append(el("h2",{},"Salidas de caja"));
  p.append(el("p",{class:"hint"},"Hay dos maneras de que el efectivo salga de la caja: el retiro (se lo lleva el tesorero y cierra el período) y el depósito bancario (la plata va a la cuenta y el período sigue abierto). Las dos bajan el saldo. Tarjetas, billetera y otros valores no se tocan porque nunca entraron a la caja física."));
  p.append(el("div",{class:"row",style:"gap:8px"},
    el("button",{class:"btn",type:"button",onclick:dialogoRetiro,disabled:saldoEfectivo()<=0?"":null},"Registrar retiro"),
    el("button",{class:"btn ghost",type:"button",onclick:dialogoDeposito,disabled:saldoEfectivo()<=0?"":null},"Registrar depósito")));

  const rets=retirosOrd().filter(r=>!esDeposito(r));
  const deps=retirosOrd().filter(esDeposito);
  if(!rets.length&&!deps.length){
    p.append(el("div",{class:"vacio"},el("b",{},"Todavía no hay salidas"),
      "Cuando el tesorero se lleve la plata o la deposites en el banco, anotalo acá."));
    c.append(p);return c;
  }
  const rotulo=t=>el("div",{class:"f",style:"margin:22px 0 8px"},t);
  const borrar=r=>async()=>{
    const dep=esDeposito(r);
    if(!await confirmar(dep?"Eliminar depósito":"Eliminar retiro",
      `${dep?"Depósito":"Retiro"} del ${fechaCorta(r.fecha)} por ${plata(r.monto)}. Al eliminarlo, ese efectivo vuelve al saldo de caja.`,
      {ok:"Eliminar",peligro:true}))return;
    db.retiros=db.retiros.filter(x=>x.id!==r.id);delete db.comprobantes["retiro|"+r.id];
    guardar();toast(dep?"Depósito eliminado.":"Retiro eliminado.");render();
  };

  if(rets.length){
    p.append(rotulo("Retiros de efectivo"));
    const tab=el("table",{class:"data"});
    tab.append(el("thead",{},el("tr",{},el("th",{},"Fecha"),el("th",{},"Tesorero"),el("th",{class:"num"},"Monto"),
      el("th",{class:"num"},"Días"),el("th",{class:"num"},"Efectivo del período"),el("th",{class:"num"},"Diferencia"),
      el("th",{},"Detalle"),el("th",{},"Comprobante"),el("th",{},""))));
    const tb=el("tbody",{});
    for(let i=rets.length-1;i>=0;i--){
      const r=rets[i], desde=i>0?rets[i-1].fecha:null;
      const gp=db.grupos.filter(g=>g.fecha<=r.fecha&&(!desde||g.fecha>=desde));
      const tp=totales(gp);
      // el efectivo del período ya salió en parte si hubo depósitos en el medio
      const dp=deps.filter(d=>d.fecha<=r.fecha&&(!desde||d.fecha>=desde)).reduce((a,d)=>a+d.monto,0);
      const dif=tp.efectivo-dp-r.monto;
      tb.append(el("tr",{},el("td",{},fechaCorta(r.fecha)),el("td",{},el("span",{class:"cajero-tag"},r.responsable)),
        el("td",{class:"num",style:"font-weight:700"},plata(r.monto)),
        el("td",{class:"num"},String(new Set(gp.map(g=>g.fecha)).size)),
        el("td",{class:"num chip-ef",title:dp?"Ya se habían depositado "+plata(dp)+" en el banco":null},
          plata(tp.efectivo-dp)),
        el("td",{class:"num"+(Math.abs(dif)>0.5?" neg":"")},Math.abs(dif)<0.5?"—":plata(dif)),
        el("td",{},r.detalle||"—"),
        celdaComps("retiro|"+r.id),
        el("td",{},el("button",{class:"btn ghost small",type:"button",onclick:borrar(r)},"Eliminar"))));
    }
    tab.append(tb); p.append(el("div",{class:"tabla-scroll"},tab));
  }

  if(deps.length){
    p.append(rotulo("Depósitos bancarios"));
    const tab=el("table",{class:"data"});
    tab.append(el("thead",{},el("tr",{},el("th",{},"Fecha"),el("th",{},"Depositó"),el("th",{class:"num"},"Monto"),
      el("th",{},"Banco"),el("th",{},"N° de boleta"),el("th",{},"Detalle"),el("th",{},"Comprobante"),el("th",{},""))));
    const tb=el("tbody",{});
    for(let i=deps.length-1;i>=0;i--){
      const r=deps[i];
      tb.append(el("tr",{},el("td",{},fechaCorta(r.fecha)),el("td",{},el("span",{class:"cajero-tag"},r.responsable)),
        el("td",{class:"num",style:"font-weight:700"},plata(r.monto)),
        el("td",{},r.banco||"—"),
        el("td",{style:"font-family:var(--mono)"},r.referencia||"—"),
        el("td",{},r.detalle||"—"),
        celdaComps("retiro|"+r.id),
        el("td",{},el("button",{class:"btn ghost small",type:"button",onclick:borrar(r)},"Eliminar"))));
    }
    tab.append(tb); p.append(el("div",{class:"tabla-scroll"},tab));
    const tot=deps.reduce((a,d)=>a+d.monto,0);
    p.append(el("p",{class:"hint",style:"margin-top:10px"},`${deps.length} depósito${deps.length===1?"":"s"} por ${plata(tot)} en total.`));
  }
  c.append(p); return c;
}

/* Retiro y depósito comparten formulario. Difieren en quién figura, si piden
   banco + N° de boleta, y en qué campos son obligatorios. Los dos restan del
   efectivo; sólo el retiro cierra período. */
const SALIDA={
  retiro:{
    titulo:"Registrar retiro", boton:"Registrar retiro",
    quien:"Tesorero", gente:()=>db.responsables,
    sinSaldo:"No hay efectivo para retirar.",
    detallePh:"Entrega de plata", pideBanco:false, compObligatorio:false,
    comp:"Comprobante del retiro",
    compHint:"Recibo firmado, foto del sobre o comprobante de transferencia. PNG, JPG, WEBP o PDF, hasta 400 KB.",
    todo:"Retira todo. El saldo queda en cero.",
    exceso:["Estás retirando %M% más de lo que hay registrado en caja.",
            "Puede ser un error de carga, o efectivo que todavía no importaste."],
    ok:m=>`Retiro de ${plata(m)} registrado`},
  deposito:{
    titulo:"Registrar depósito bancario", boton:"Registrar depósito",
    quien:"Depositó", gente:()=>db.depositantes,
    sinSaldo:"No hay efectivo para depositar.",
    detallePh:"Opcional: aclaración interna", pideBanco:true, compObligatorio:true,
    comp:"Comprobante del depósito",
    compHint:"Boleta de depósito, ticket del cajero automático o captura del homebanking. PNG, JPG, WEBP o PDF, hasta 400 KB.",
    todo:"Deposita todo. El saldo queda en cero.",
    exceso:["Estás depositando %M% más de lo que hay registrado en caja.",
            "Puede ser un error de carga, o efectivo que todavía no importaste."],
    ok:m=>`Depósito de ${plata(m)} registrado`}
};
const dialogoRetiro=()=>dialogoSalida("retiro");
const dialogoDeposito=()=>dialogoSalida("deposito");

function dialogoSalida(tipo){
  const S=SALIDA[tipo];
  const saldo=saldoEfectivo();
  if(saldo<=0){toast(S.sinSaldo);return}
  const req=S.pideBanco?" *":"";
  const iF=el("input",{type:"date",value:hoyISO(),max:hoyISO()});
  const sR=el("select",{},...S.gente().map(r=>el("option",{value:r},r)));
  // los centavos importan: con Math.round() el remanente daba -$0,50
  const iM=el("input",{class:"money",type:"text",value:saldo.toFixed(2).replace(".",","),
    style:"width:170px;font-size:16px"});
  const iD=el("input",{type:"text",placeholder:S.detallePh,style:"width:100%"});
  const sB=S.pideBanco?el("select",{},el("option",{value:""},"Elegí el banco"),
    ...BANCOS.map(b=>el("option",{value:b},b))):null;
  const iB=S.pideBanco?el("input",{type:"text",placeholder:"Ej.: 0012345",
    style:"width:100%;font-family:var(--mono)"}):null;
  const av=el("div",{style:"font-size:12.5px;margin-top:10px"});
  const err=el("p",{class:"err-campo",style:"display:none"});

  /* --- comprobante: click o arrastrar --- */
  const buf=[]; const chips=el("div",{style:"margin-bottom:9px"});
  const fi=el("input",{type:"file",multiple:"multiple",
    accept:"image/png,image/jpeg,image/webp,application/pdf",style:"display:none",
    onchange:e=>{[...e.target.files].forEach(f=>procesarArchivo(f,c=>{buf.push(c);pintarBuf()}));e.target.value=""}});
  const zona=el("div",{class:"drop mini",onclick:()=>fi.click()},
    el("b",{},"Arrastrá el comprobante acá"),
    el("small",{},"o hacé clic para buscarlo"));
  // sin stopPropagation el archivo lo agarra el drop global y se va a "Importar listados"
  ["dragenter","dragover"].forEach(ev=>zona.addEventListener(ev,e=>{
    e.preventDefault();e.stopPropagation();zona.classList.add("hot")}));
  ["dragleave","dragend"].forEach(ev=>zona.addEventListener(ev,e=>{
    e.preventDefault();e.stopPropagation();zona.classList.remove("hot")}));
  zona.addEventListener("drop",e=>{
    e.preventDefault();e.stopPropagation();zona.classList.remove("hot");
    const fs=e.dataTransfer&&e.dataTransfer.files;
    if(fs&&fs.length)[...fs].forEach(f=>procesarArchivo(f,c=>{buf.push(c);pintarBuf()}));
  });
  const pintarBuf=()=>{
    chips.replaceChildren();
    buf.forEach((c,i)=>chips.append(el("span",{class:"comp-chip"},
      el("a",{title:Math.round(c.bytes/1024)+" KB",onclick:e=>{e.stopPropagation();abrirComp(c)}},c.nombre),
      el("button",{type:"button",title:"Quitar",onclick:e=>{e.stopPropagation();buf.splice(i,1);pintarBuf()}},"×"))));
    zona.classList.remove("falta");
    if(buf.length) err.style.display="none";
    zona.firstChild.textContent=buf.length?"Arrastrá otro comprobante":"Arrastrá el comprobante acá";
  };
  pintarBuf();

  const ck=()=>{const m=parseMonto(iM.value);const igual=Math.abs(m-saldo)<.005;
    av.textContent=igual?S.todo:`Queda un remanente de ${plata(saldo-m)} en caja.`;
    av.style.color=igual?"var(--efectivo)":"var(--aviso)"};
  iM.addEventListener("input",ck); ck();
  [iF,sR,iM,sB,iB].forEach(c=>c&&c.addEventListener("input",()=>{err.style.display="none"}));
  const fallar=(txt,foco)=>{err.textContent=txt;err.style.display="";if(foco)foco.focus();return false};

  modal({titulo:S.titulo,cuerpo:el("div",{},
    el("div",{style:"font-family:var(--mono);font-size:13px;margin-bottom:14px;color:var(--ink-2)"},
      "Efectivo en caja: ",el("b",{style:"color:var(--efectivo)"},plata(saldo))),
    el("div",{class:"row"},
      el("label",{class:"f"},"Fecha"+req,iF),
      el("label",{class:"f"},S.quien+req,sR),
      el("label",{class:"f"},"Monto"+req,pesos(iM))),
    S.pideBanco?el("div",{class:"row",style:"margin-top:12px"},
      el("label",{class:"f",style:"flex:1 1 190px"},"Banco *",sB),
      el("label",{class:"f",style:"flex:1 1 190px"},"N° de boleta *",iB)):null,
    el("label",{class:"f",style:"margin-top:12px"},"Detalle"+(S.pideBanco?" (opcional)":""),iD),
    av,
    el("div",{style:"margin-top:16px;border-top:1px dashed var(--linea);padding-top:12px"},
      el("div",{class:"f",style:"margin-bottom:7px"},S.comp+(S.compObligatorio?" *":"")),
      el("p",{class:"hint",style:"margin:0 0 9px"},S.compHint),
      chips,zona,fi),
    S.pideBanco?el("p",{class:"hint",style:"margin:12px 0 0"},"Los campos con * son obligatorios."):null,
    err),
    acciones:[{texto:"Cancelar"},{texto:S.boton,clase:"",accion:async()=>{
      err.style.display="none"; zona.classList.remove("falta");
      const m=parseMonto(iM.value);
      if(!iF.value) return fallar("Falta la fecha.",iF);
      if(!sR.value) return fallar("Falta indicar quién.",sR);
      if(m<=0)      return fallar("El monto tiene que ser mayor a cero.",iM);
      if(S.pideBanco){
        if(!sB.value)         return fallar("Elegí el banco.",sB);
        if(!iB.value.trim())  return fallar("Falta el N° de boleta.",iB);
      }
      if(S.compObligatorio&&!buf.length){
        zona.classList.add("falta");
        return fallar("Adjuntá el comprobante del depósito.",null);
      }
      if(m>saldo+.5&&!await confirmar("El monto supera el saldo",
        S.exceso.map(t=>t.replace("%M%",plata(m-saldo))),
        {ok:"Registrar igual"}))return false;
      const rid=uid();
      db.retiros.push({id:rid,fecha:iF.value,responsable:sR.value,monto:m,
        detalle:iD.value.trim(),tipo:tipo,
        banco:sB?sB.value:"",referencia:iB?iB.value.trim():"",creado:Date.now()});
      guardar();
      let subidos=0;
      if(buf.length){
        toast(buf.length===1?"Subiendo el comprobante…":"Subiendo "+buf.length+" comprobantes…");
        for(const c of buf) if(await subirComp("retiro|"+rid,c)) subidos++;
      }
      toast(S.ok(m)+(buf.length?` con ${subidos} de ${buf.length} comprobante(s)`:"")+".");
      render()}}]});
}

   ============================================================ */
let fechaManual=hoyISO();
function vistaManual(){
  const c=el("div",{}); const p=el("div",{class:"panel"});
  p.append(el("h2",{},"Cargar a mano"));
  p.append(el("p",{class:"hint"},"Sólo para cuando no tengas el listado del sistema. Enter pasa al siguiente campo, Ctrl+Enter guarda."));
  const iF=el("input",{type:"date",value:fechaManual,max:hoyISO(),onchange:e=>{fechaManual=e.target.value;render()}});
  p.append(el("div",{class:"row",style:"margin-bottom:16px"},el("label",{class:"f"},"Fecha",iF),
    el("div",{style:"font-size:12.5px;color:var(--ink-2);padding-bottom:8px"},fechaLarga(fechaManual))));

  const tab=el("table",{class:"data"});
  tab.append(el("thead",{},el("tr",{},el("th",{},"Cajero"),el("th",{class:"num"},"Efectivo"),
    el("th",{class:"num"},"Tarjetas"),el("th",{class:"num"},"Billetera"),el("th",{class:"num"},"Total"))));
  const tb=el("tbody",{}); const filas=[];
  for(const cj of db.cajeros){
    const ya=db.grupos.some(g=>g.fecha===fechaManual&&g.cajero===cj);
    const i1=el("input",{class:"money",type:"text",placeholder:"0"}),i2=el("input",{class:"money",type:"text",placeholder:"0"}),i3=el("input",{class:"money",type:"text",placeholder:"0"});
    const td=el("td",{class:"num",style:"color:var(--ink-3);font-family:var(--mono)"},"—");
    const rc=()=>{const t=parseMonto(i1.value)+parseMonto(i2.value)+parseMonto(i3.value);td.textContent=t?plata(t):"—";td.style.color=t?"var(--ink)":"var(--ink-3)"};
    [i1,i2,i3].forEach(i=>i.addEventListener("input",rc));
    filas.push({cj,i1,i2,i3});
    tb.append(el("tr",{},el("td",{},el("span",{class:"cajero-tag"},cj),ya?el("div",{style:"font-size:11px;color:var(--aviso);font-weight:600"},"ya cargado"):null),
      el("td",{class:"num"},pesos(i1)),el("td",{class:"num"},pesos(i2)),el("td",{class:"num"},pesos(i3)),td));
  }
  tab.append(tb); p.append(el("div",{class:"tabla-scroll",style:"max-height:none"},tab));
  const guardarDia=()=>{
    const nuevos=[];
    for(const f of filas){
      for(const[inp,medio,cat]of[[f.i1,"EFECTIVO","efectivo"],[f.i2,"TARJETA (CARGA MANUAL)","tarjeta"],[f.i3,"BILLETERA VIRTUAL","billetera"]]){
        const v=parseMonto(inp.value); if(inp.value.trim()==="")continue;
        if(v===0)continue;
        nuevos.push({id:uid(),imp:"manual",fecha:fechaManual,cajero:f.cj,medio,categoria:cat,monto:v,n:0,comps:[]});
      }
    }
    if(!nuevos.length){toast("No hay nada para guardar.");return}
    const claves=new Set(nuevos.map(n=>n.fecha+"|"+n.cajero));
    const choca=db.grupos.some(g=>claves.has(g.fecha+"|"+g.cajero));
    const commit=rep=>{
      if(rep)db.grupos=db.grupos.filter(g=>!claves.has(g.fecha+"|"+g.cajero));
      db.grupos.push(...nuevos);guardar();toast(`${nuevos.length} línea(s) guardadas.`);vista="dias";render()};
    if(choca) modal({titulo:"Ese día ya tiene datos",cuerpo:el("div",{},el("p",{},"Algunos cajeros ya tienen movimientos ese día."),el("p",{class:"hint"},"Reemplazar borra lo anterior de esos cajeros. Sumar deja los dos y queda marcado para revisar.")),
      acciones:[{texto:"Cancelar"},{texto:"Sumar",accion:()=>commit(false)},{texto:"Reemplazar",clase:"",accion:()=>commit(true)}]});
    else commit(false);
  };
  p.append(el("div",{class:"row",style:"margin-top:16px"},
    el("button",{class:"btn",type:"button",onclick:guardarDia},"Guardar el día"),
    el("button",{class:"btn ghost",type:"button",onclick:()=>render()},"Limpiar")));
  const inputs=filas.flatMap(f=>[f.i1,f.i2,f.i3]);
  inputs.forEach((x,i)=>x.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();guardarDia()}
    else if(e.key==="Enter"){e.preventDefault();(inputs[i+1]||inputs[0]).focus()}}));
  c.append(p); if(filas.length)setTimeout(()=>filas[0].i1.focus(),0);
  return c;
}

function bajar(nombre,contenido,tipo){
  const b=new Blob(["\ufeff"+contenido],{type:tipo+";charset=utf-8"});
  const u=URL.createObjectURL(b); const a=el("a",{href:u,download:nombre});
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);
}
function exportarJSON(){
  const n=`caja-respaldo-${hoyISO()}.json`;
  bajar(n,JSON.stringify(db),"application/json");
  toast("Respaldo descargado: "+n);
  pintarCinta(); if(vista==="datos")render();
}
function importarJSON(f){
  if(!f)return; const fr=new FileReader();
  fr.onload=()=>{
    let d;try{d=JSON.parse(fr.result)}catch(e){avisar("Archivo ilegible","Ese archivo no es un respaldo válido de la caja. Buscá el .json que descargaste desde Datos y respaldo.");return}
    const gr=d.grupos||d.movimientos;
    if(!Array.isArray(gr)){avisar("Respaldo vacío","El archivo se leyó bien pero no contiene movimientos.");return}
    modal({titulo:"Restaurar respaldo",cuerpo:el("div",{},
      el("p",{},`El respaldo trae ${gr.length} grupos y ${(d.retiros||[]).length} retiros.`),
      el("p",{},`Ahora tenés ${db.grupos.length} grupos y ${db.retiros.length} retiros.`),
      el("p",{class:"hint"},"Reemplazar descarta lo actual. Sumar une los dos y descarta duplicados exactos.")),
      acciones:[{texto:"Cancelar"},
      {texto:"Sumar",accion:()=>{
        const k=new Set(db.grupos.map(g=>[g.fecha,g.cajero,g.medio,g.monto].join("|")));
        let n=0;for(const g of gr){const kk=[g.fecha,g.cajero,g.medio,g.monto].join("|");
          if(k.has(kk))continue;k.add(kk);db.grupos.push({...g,id:uid(),imp:"manual"});n++}
        const kr=new Set(db.retiros.map(r=>[r.fecha,r.monto,r.tipo||"retiro"].join("|")));
        for(const r of(d.retiros||[]))if(!kr.has([r.fecha,r.monto,r.tipo||"retiro"].join("|")))db.retiros.push({...r,id:uid()});
        for(const c of(d.cajeros||[]))if(!db.cajeros.includes(c))db.cajeros.push(c);
        Object.assign(db.revisados,d.revisados||{});
        guardar();
        toast(`${n} grupos nuevos subidos a la nube.`+
          (Object.keys(d.comprobantes||{}).length?" Los comprobantes del respaldo no se migran: adjuntalos de nuevo.":""));
        render()}},
      {texto:"Reemplazar todo",clase:"danger",accion:async()=>{
        if(!await confirmar("Reemplazar toda la caja",
          ["Esto borra la caja de la nube para todas las sedes y todos los usuarios, no sólo en esta computadora.",
           "No hay forma de deshacerlo."],
          {ok:"Reemplazar todo",peligro:true}))return false;
        db.grupos=gr.map(g=>({...g,id:uid(),imp:"manual"}));
        db.retiros=(d.retiros||[]).map(r=>({...r,id:uid()}));
        db.importaciones=[];
        db.revisados=d.revisados||{};
        guardar();toast("Respaldo subido a la nube.");render()}}]});
  };
  fr.readAsText(f,"utf-8");
}
/* ============================================================
   EXPORTACI\u00d3N A EXCEL
   Mismo formato que la pantalla: fechas dd/mm/aaaa, importes en
   pesos con separador de miles. Los importes van como N\u00daMERO con
   formato aplicado, no como texto: se leen igual y se pueden sumar.
   ============================================================ */
const FMT_PESOS='"$" #,##0;[Red]-"$" #,##0';
const FMT_FECHA='dd/mm/yyyy';
const aFecha=i=>{const[a,m,d]=i.split("-").map(Number);return new Date(a,m-1,d)};

function hojaDeDias(dias){
  const cab=["Fecha","Cajero","Efectivo","Tarjetas","Billetera","Otros valores","Total","Comprobantes","Estado"];
  const filas=dias.map(d=>[
    aFecha(d.fecha), d.cajero,
    d.efectivo||0, d.tarjeta||0, d.billetera||0, d.otros||0, d.total||0,
    d.comps||0, estaRevisado(d)?"Revisado":""
  ]);
  const tot=dias.reduce((a,d)=>({ef:a.ef+(d.efectivo||0),ta:a.ta+(d.tarjeta||0),
    bi:a.bi+(d.billetera||0),ot:a.ot+(d.otros||0),to:a.to+(d.total||0),n:a.n+(d.comps||0)}),
    {ef:0,ta:0,bi:0,ot:0,to:0,n:0});
  filas.push([]);
  filas.push(["TOTAL","",tot.ef,tot.ta,tot.bi,tot.ot,tot.to,tot.n,""]);

  const ws=XLSX.utils.aoa_to_sheet([cab,...filas],{cellDates:true});
  ws["!cols"]=[{wch:12},{wch:14},{wch:14},{wch:14},{wch:14},{wch:14},{wch:15},{wch:14},{wch:11}];
  ws["!freeze"]={xSplit:0,ySplit:1};
  const rango=XLSX.utils.decode_range(ws["!ref"]);
  for(let r=1;r<=rango.e.r;r++){
    const cf=ws[XLSX.utils.encode_cell({r,c:0})];
    if(cf&&cf.t==="d") cf.z=FMT_FECHA;
    for(let c=2;c<=6;c++){
      const ref=XLSX.utils.encode_cell({r,c}), cel=ws[ref];
      if(cel&&cel.t==="n") cel.z=FMT_PESOS;
    }
  }
  return ws;
}

function exportarCSV(gr){
  const dias=porDia(gr);
  if(!dias.length){toast("No hay nada para exportar en ese rango.");return}
  try{
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,hojaDeDias(dias),"Rendici\u00f3n de caja");

    const rt=db.retiros.filter(r=>{
      const f=dias.map(d=>d.fecha);
      return r.fecha>=f[0] && r.fecha<=f[f.length-1];
    }).sort((a,b)=>a.fecha.localeCompare(b.fecha));
    if(rt.length){
      const ws2=XLSX.utils.aoa_to_sheet([["Fecha","Tipo","Responsable","Monto","Banco","N° de boleta","Detalle"],
        ...rt.map(r=>[aFecha(r.fecha),esDeposito(r)?"Depósito":"Retiro",r.responsable,r.monto||0,
                      r.banco||"",r.referencia||"",r.detalle||""])],{cellDates:true});
      ws2["!cols"]=[{wch:12},{wch:11},{wch:18},{wch:15},{wch:16},{wch:18},{wch:34}];
      const rr=XLSX.utils.decode_range(ws2["!ref"]);
      for(let r=1;r<=rr.e.r;r++){
        const cf=ws2[XLSX.utils.encode_cell({r,c:0})];
        if(cf&&cf.t==="d") cf.z=FMT_FECHA;
        const cel=ws2[XLSX.utils.encode_cell({r,c:3})];
        if(cel&&cel.t==="n") cel.z=FMT_PESOS;
      }
      XLSX.utils.book_append_sheet(wb,ws2,"Retiros y depósitos");
    }

    XLSX.writeFile(wb,`caja-${hoyISO()}.xlsx`,{cellStyles:true,cellDates:true});
    toast(`${dias.length} d\u00edas exportados a Excel.`);
  }catch(e){
    console.error("[caja] export",e);
    toast("No se pudo generar el Excel: "+e.message);
  }
}

function pintarCinta(){

    t.otros?el("div",{class:"cr"},el("span",{},"Otros valores"),el("b",{style:"color:var(--otros)"},plata(t.otros))):null,
    el("div",{class:"cr",style:"border-top:1px dashed var(--linea);padding-top:7px"},el("span",{},"Facturado"),el("b",{},plata(t.total))),
    dep?el("div",{class:"cr"},el("span",{},"Depositado"),el("b",{style:"color:var(--aviso)"},"− "+plata(dep))):null,
    el("div",{class:"cr"},el("span",{},"Días"),el("b",{},String(new Set(gr.map(g=>g.fecha)).size)))
  ].filter(Boolean));
  const r=diasARevisar().filter(x=>!estaRevisado(x.d)).length; $("#cnt-rev").textContent=r?`(${r})`:"";
  $("#btn-retirar").disabled=s<=0; $("#btn-depositar").disabled=s<=0;
}

function leerEscudo(){try{return localStorage.getItem(ESC_KEY)||""}catch(e){return ""}}
function pintarEscudo(){
  const img=$("#escudo"), mk=$("#marca"); if(!img) return;
  const propio=leerEscudo();
  const sede=$("#marca-sede"); if(sede) sede.textContent=SEDE;
  if(propio){ img.src=propio; img.classList.add("on"); if(mk) mk.style.display="none"; }
  else      { img.classList.remove("on"); img.removeAttribute("src"); if(mk) mk.style.display=""; }
}
function cargarEscudo(f){
  if(!f) return;
  if(!/^image\/(png|jpeg|webp|svg\+xml|gif)$/.test(f.type)){toast("Tiene que ser una imagen (png, jpg, svg o webp).");return}
  if(f.size>300*1024){toast("La imagen pesa "+(f.size/1024|0)+" KB. Máximo 300 KB.");return}
  const fr=new FileReader();
  fr.onload=()=>{
    try{localStorage.setItem(ESC_KEY,fr.result)}catch(e){toast("No se pudo guardar la imagen.");return}
    pintarEscudo();toast("Encabezado reemplazado.");render();
  };
  fr.onerror=()=>toast("No se pudo leer la imagen.");
  fr.readAsDataURL(f);
}
function quitarEscudo(){try{localStorage.removeItem(ESC_KEY)}catch(e){}pintarEscudo();toast("Encabezado original restaurado.");render()}

  const est=el("p",{class:"hint",style:"margin:10px 0 0"},"Escribí la palabra exacta, en mayúsculas.");

    el("p",{},el("b",{},"Esto borra la caja de la NUBE."),
      " No es sólo esta computadora: desaparece para todas las sedes y todos los usuarios, al instante y sin deshacer."),
    el("p",{},"Para confirmar, escribí BORRAR y presioná el botón rojo."),
    el("label",{class:"f"},"Confirmación",inp),est),
    acciones:[{texto:"Cancelar"},
      {texto:"Borrar definitivamente",clase:"danger",accion:()=>{
        if(inp.value.trim()!=="BORRAR"){est.textContent="No coincide. Escribí BORRAR, en mayúsculas.";est.style.color="var(--alerta)";inp.focus();return false}

        db.grupos=[];db.retiros=[];db.importaciones=[];db.revisados={};

        guardar();toast("Todo borrado de la nube.");render();
      }}]});

/* ============================================================
   REVISADOS Y COMPROBANTES
   ============================================================ */
const MAX_ARCH=5*1024*1024, TOPE_DB=Infinity;
function claveDia(d){return d.fecha+"|"+d.cajero}
function estaRevisado(d){return !!db.revisados[claveDia(d)]}
function compsDe(d){return db.comprobantes[claveDia(d)]||[]}
function tamDB(){return 0}
async function marcarRevisado(d,on){
  if(!puedeEditar()){toast("Tu usuario es de solo lectura.");return}
  const k=claveDia(d);
  if(on){
    let nota="";
    if(!compsDe(d).length){
      const r=await confirmar("Revisar sin comprobantes",
        [`El ${fechaCorta(d.fecha)} de ${d.cajero} no tiene ningún comprobante adjunto.`,
         "Podés darlo por revisado igual, pero dejá constancia de en qué te basaste. Queda guardado junto a la marca."],
        {ok:"Marcar revisado", kicker:"Requiere observaci\u00f3n",
         campo:{etiqueta:"Observaci\u00f3n de la revisi\u00f3n",
                ejemplo:"Ej: contado con planilla de caja del turno tarde, cierra con el sistema.",
                minimo:8,
                error:"Escrib\u00ed en qué te basaste para darlo por revisado."}});
      if(!r) return;
      nota=r;
    }
    db.revisados[k]={ts:Date.now(),fecha:d.fecha,cajero:d.cajero,nota};
  }else delete db.revisados[k];
  guardar();toast(on?"Marcado como revisado.":"Reabierto para revisión.");render();
}
function pesos(inp){return el("span",{class:"money-wrap"},inp)}
function procesarArchivo(file,cb){
  if(!file)return;
  const esImg=/^image\/(png|jpeg|webp)$/.test(file.type);
  if(!esImg&&file.type!=="application/pdf"){toast("S\u00f3lo PNG, JPG, WEBP o PDF.");return}
  if(file.size>MAX_ARCH){toast("El archivo pesa "+Math.round(file.size/1024)+" KB y el m\u00e1ximo es "+Math.round(MAX_ARCH/1024)+" KB.");return}
  cb({nombre:file.name.slice(0,120),bytes:file.size,blob:file});
}

function rutaComp(clave,nombre){
  const carpeta=clave.replace(/[^A-Za-z0-9_-]+/g,"_");
  const limpio=nombre.replace(/[^A-Za-z0-9._-]+/g,"_").slice(-80);
  return SEDE_SLUG+"/"+carpeta+"/"+uid()+"_"+limpio;
}

/* Sube UN comprobante ya validado por procesarArchivo. Devuelve true/false.
   Es la única vía real de subida: la usan el botón "Adjuntar" de la tabla y
   los diálogos de retiro/depósito. */
async function subirComp(clave,c){
  const path=rutaComp(clave,c.nombre);
  try{
    await stSubir(path,c.blob);
    const fila=await sbInsert("caja_comprobantes",
      {sede:SEDE,clave,path,nombre:c.nombre,bytes:c.bytes,creado_por:AUTHUID});
    const r=Array.isArray(fila)?fila[0]:fila;
    (db.comprobantes[clave]=db.comprobantes[clave]||[]).push(
      {id:r.id,nombre:c.nombre,bytes:c.bytes,path});
    return true;
  }catch(e){
    await stBorrar(path);
    toast("No se pudo adjuntar "+c.nombre+": "+e.message);
    return false;
  }
}
function adjuntar(clave,file){
  if(!puedeEditar()){toast("Tu usuario es de solo lectura.");return}
  procesarArchivo(file,async c=>{
    if(await subirComp(clave,c)){
      toast("Comprobante adjuntado ("+Math.round(c.bytes/1024)+" KB).");
      render();
    }
  });
}

function abrirComp(c){
  const w=window.open("","_blank","noopener");
  stFirmar(c.path).then(u=>{ if(w) w.location=u; else window.open(u,"_blank","noopener"); })
    .catch(e=>{ if(w)w.close(); toast(e.message); });
}

async function quitarComp(clave,id){
  if(!puedeEditar()){toast("Tu usuario es de solo lectura.");return}
  const lista=db.comprobantes[clave]||[], c=lista.find(x=>x.id===id);
  if(!c)return;
  if(!await confirmar("Quitar comprobante",
    `Se elimina "${c.nombre}" de forma definitiva. No hay deshacer.`,
    {ok:"Quitar",peligro:true}))return;
  try{
    await sbDel("caja_comprobantes","id=eq."+id);
    await stBorrar(c.path);
    db.comprobantes[clave]=lista.filter(x=>x.id!==id);
    if(!db.comprobantes[clave].length)delete db.comprobantes[clave];
    toast("Comprobante quitado.");render();
  }catch(e){toast("No se pudo quitar: "+e.message)}
}

function chipsComps(clave,quitar){
  const out=[];
  for(const c of (db.comprobantes[clave]||[]))
    out.push(el("span",{class:"comp-chip"},
      el("a",{title:c.nombre+" \u00b7 "+Math.round(c.bytes/1024)+" KB",onclick:()=>abrirComp(c)},c.nombre),
      quitar?el("button",{type:"button",title:"Quitar",onclick:()=>quitar(c.id)},"\u00d7"):null));
  return out;
}
function celdaComps(clave){
  const cont=el("td",{style:"white-space:normal;min-width:190px"});
  chipsComps(clave,puedeEditar()?(id=>quitarComp(clave,id)):null).forEach(x=>cont.append(x));
  if(!puedeEditar()){
    if(!cont.childNodes.length)cont.append(el("span",{class:"hint"},"\u2014"));
    return cont;
  }
  const inp=el("input",{type:"file",accept:"image/png,image/jpeg,image/webp,application/pdf",style:"display:none",
    onchange:e=>{adjuntar(clave,e.target.files[0]);e.target.value=""}});
  cont.append(el("button",{class:"btn ghost small",type:"button",onclick:()=>inp.click()},"Adjuntar"),inp);
  return cont;
}

function reloj(){$("#reloj").textContent=new Date().toLocaleDateString("es-AR",{weekday:"short",day:"2-digit",month:"short",year:"numeric"}).toUpperCase()+" \u00b7 "+new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit",hourCycle:"h23"})}

/* ============================================================
   MODO SOLO LECTURA
   El servidor ya rechaza toda escritura sin nivel edit/admin
   (pol\u00edticas RLS). Esto s\u00f3lo evita que la persona clickee
   botones que van a fallar.
   ============================================================ */
const TABS_EDICION=["importar","manual","datos"];
const BOTONES_EDICION=["adjuntar","registrar retiro","registrar depósito","eliminar","marcar revisado",
  "reabrir","deshacer","guardar","borrar","agregar","importar","reemplazar","sumar","\u00d7"];

function aplicarModo(){
  const ro=!puedeEditar();
  document.body.classList.toggle("ro",ro);
  document.querySelectorAll("#tabs button").forEach(b=>{
    if(ro&&TABS_EDICION.includes(b.dataset.v)) b.remove();
  });
  $("#btn-retirar").style.display=ro?"none":"";
  $("#btn-depositar").style.display=ro?"none":"";
  $("#btn-backup").textContent=ro?"Exportar respaldo":"Guardar respaldo";
  if(ro&&TABS_EDICION.includes(vista)) vista="dias";
}
function limpiarBotonesEdicion(){
  if(puedeEditar())return;
  document.querySelectorAll("#main button").forEach(b=>{
    const t=(b.textContent||"").trim().toLowerCase();
    if(BOTONES_EDICION.some(x=>t===x||t.startsWith(x))) b.remove();
  });
}

/* ============================================================
   ACCESO POR CODIGO (OTP 6 digitos)
   ============================================================ */
const gate=()=>$("#gate");
function mostrarGate(msg,clase){
  gate().classList.add("on");
  document.body.classList.add("gated");
  document.body.classList.remove("cargando");
  if(msg){const h=$("#gate-hint");h.textContent=msg;h.className="gate-hint "+(clase||"")}
}
function ocultarGate(){gate().classList.remove("on");document.body.classList.remove("gated")}

let MAIL_OTP="";

async function enviarCodigo(){
  const mail=$("#gate-mail").value.trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){mostrarGate("Ese correo no parece v\u00e1lido.","err");return}
  if(!window.sbAuth){mostrarGate("No carg\u00f3 el cliente de Supabase. Revis\u00e1 la conexi\u00f3n.","err");return}
  const btn=$("#gate-btn");btn.disabled=true;btn.textContent="Enviando\u2026";
  try{
    const {error}=await window.sbAuth.auth.signInWithOtp({email:mail,options:{shouldCreateUser:false}});
    if(error)throw error;
    MAIL_OTP=mail;
    $("#gate-form").style.display="none";
    $("#gate-form2").style.display="flex";
    $("#gate-msg").textContent="Te enviamos un c\u00f3digo a "+mail+". Escribilo ac\u00e1 abajo.";
    mostrarGate("Revis\u00e1 tu correo. El c\u00f3digo vence en una hora.","ok");
    setTimeout(function(){$("#gate-code").focus()},80);
  }catch(e){
    mostrarGate("No se pudo enviar: "+(e.message||e),"err");
    btn.disabled=false;btn.textContent="Enviarme el c\u00f3digo";
  }
}

async function verificarCodigo(){
  const code=$("#gate-code").value.replace(/\D/g,"");
  if(code.length<6){mostrarGate("Escrib\u00ed el c\u00f3digo completo tal cual figura en el correo.","err");return}
  const btn=$("#gate-btn2");btn.disabled=true;btn.textContent="Verificando\u2026";
  try{
    const {error}=await window.sbAuth.auth.verifyOtp({email:MAIL_OTP,token:code,type:"email"});
    if(error)throw error;
    location.reload();
  }catch(e){
    mostrarGate("C\u00f3digo incorrecto o vencido. Revis\u00e1 el \u00faltimo correo que recibiste.","err");
    btn.disabled=false;btn.textContent="Entrar";
    $("#gate-code").select();
  }
}

function volverAlMail(){
  MAIL_OTP="";
  $("#gate-form2").style.display="none";
  $("#gate-form").style.display="flex";
  $("#gate-code").value="";
  $("#gate-btn").disabled=false;$("#gate-btn").textContent="Enviarme el c\u00f3digo";
  $("#gate-msg").textContent="Ingres\u00e1 tu correo institucional. Te enviamos un c\u00f3digo num\u00e9rico para entrar.";
  mostrarGate(" ","");
}

async function cerrarSesion(){
  try{await window.sbAuth.auth.signOut()}catch(e){}
  location.href=location.pathname;
}

async function arrancar(){
  document.body.classList.add("cargando","gated");
  reloj();setInterval(reloj,30000);
  pintarEscudo();
  $("#gate-btn").addEventListener("click",enviarCodigo);
  $("#gate-mail").addEventListener("keydown",e=>{if(e.key==="Enter")enviarCodigo()});
  $("#gate-btn2").addEventListener("click",verificarCodigo);
  $("#gate-otro").addEventListener("click",volverAlMail);
  $("#gate-code").addEventListener("input",e=>{
    e.target.value=e.target.value.replace(/\D/g,"").slice(0,10);
  });
  $("#gate-code").addEventListener("keydown",e=>{if(e.key==="Enter")verificarCodigo()});

  if(!window.sbAuth){mostrarGate("No se pudo iniciar el cliente de Supabase.","err");return}

  let sesion=null;
  try{
    const {data}=await window.sbAuth.auth.getSession();
    sesion=data&&data.session;
  }catch(e){}
  if(!sesion){mostrarGate();return}

  AUTHUID=sesion.user.id;
  try{
    const filas=await sbRpc("usuario_por_auth_id",{p_auth_user_id:AUTHUID});
    USUARIO=Array.isArray(filas)?filas[0]:filas;
  }catch(e){
    mostrarGate("No pude verificar tu usuario: "+e.message,"err");return;
  }
  if(!USUARIO){
    $("#gate-form").style.display="none";
    mostrarGate("Tu correo entr\u00f3 bien, pero no tiene un usuario asignado en el sistema. Ped\u00ed que te den de alta.","err");return;
  }
  NIVEL=(USUARIO.permisos&&USUARIO.permisos.modulos&&USUARIO.permisos.modulos.caja)||null;
  if(USUARIO.rol==="admin"&&!NIVEL) NIVEL="admin";
  if(!NIVEL){
    $("#gate-form").style.display="none";
    mostrarGate("Tu usuario no tiene acceso al m\u00f3dulo de Caja.","err");return;
  }

  ocultarGate();
  aplicarModo();
  try{
    await cargarDesdeNube();
  }catch(e){
    document.body.classList.remove("cargando");
    toast("No pude traer los datos: "+e.message);
    console.error("[caja] carga",e);
  }
  document.body.classList.remove("cargando");
  if(db.grupos.length&&vista==="importar") vista="dias";
  render();
}

arrancar();
</script>
