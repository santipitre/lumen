<!DOCTYPE html>
<html lang="es-AR">
<head>
<script>
/* Lumen Auth Gate · Administrador de turnos: sesión de Lumen (8 h) con cuenta Auth; el rol ADMINISTRADOR lo valida atencion-gate.js */
(function(){
  try{
    var s=JSON.parse(localStorage.getItem('spcd_session'));
    if(!s||!s.user||!(Date.now()-s.ts<8*60*60*1000)||!s.user.auth_user_id){ location.replace('app.html?screen=login'); }
  }catch(e){ location.replace('app.html?screen=login'); }
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070D1F">
<meta name="robots" content="noindex, nofollow">
<title>Administrador · Turnos · Lumen</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="atencion-admin.css?v=a40b5465">
<link rel="stylesheet" href="atencion-comun.css?v=103466a6">
</head>
<body>

<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#1d3a5f"/><path d="M13 9v20h13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="27" cy="12" r="4.2" fill="#c8962e"/></svg>
    <div><div class="t1">Administrador · Turnos</div><div class="t2">Lumen · Diagnóstico por Imágenes · sólo visible para vos</div></div>
  </div>
  <div class="spacer"></div>
  <nav class="links" aria-label="Pantallas">
    <a href="atencion-temprana.html">Tablet de recepción</a>
    <a href="atencion-ventanilla.html">Ventanilla</a>
    <a href="app.html">Lumen</a>
  </nav>
</header>

<div class="tabs" role="tablist" aria-label="Secciones">
  <button role="tab" id="tab-stats" aria-selected="true" aria-controls="p-stats" data-tab="stats">Estadísticas</button>
  <button role="tab" id="tab-users" aria-selected="false" aria-controls="p-users" data-tab="users">Usuarios y roles</button>
  <button role="tab" id="tab-conf"  aria-selected="false" aria-controls="p-conf"  data-tab="conf">Configuración</button>
</div>

<main>
  <section id="p-stats" role="tabpanel" aria-labelledby="tab-stats">
    <div class="bar">
      <div class="chips" id="rangos" role="group" aria-label="Período">
        <button class="chip" data-r="hoy" aria-pressed="true">Hoy</button>
        <button class="chip" data-r="7" aria-pressed="false">Últimos 7 días</button>
        <button class="chip" data-r="30" aria-pressed="false">Últimos 30 días</button>
        <button class="chip" data-r="x" aria-pressed="false">Otro período</button>
      </div>
      <div class="custom" id="custom" hidden>
        <label>Desde <input type="date" id="fDesde"></label>
        <label>Hasta <input type="date" id="fHasta"></label>
        <button class="btn primary" id="btnVer">Ver</button>
      </div>
      <div class="spacer"></div>
      <button class="btn ghost" id="btnCsv" disabled>Descargar por día (CSV)</button>
    </div>
    <p class="nota" id="notaStats"></p>
    <div id="statsBody" aria-live="polite"></div>
  </section>

  <section id="p-users" role="tabpanel" aria-labelledby="tab-users" hidden>
    <p class="nota">Elegí qué rol de atención tiene cada usuario de Lumen. Los administradores ya pueden usar todas las pantallas. Un usuario sin rol no puede entrar a la tablet ni a la ventanilla.</p>
    <div class="bar"><input type="search" id="uFiltro" placeholder="Buscar usuario…" aria-label="Buscar usuario"></div>
    <div id="usersBody"></div>
  </section>

  <section id="p-conf" role="tabpanel" aria-labelledby="tab-conf" hidden>
    <div id="confBody"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="spcd-supabase.js?v=4420ca43"></script>
<script src="atencion-cola.js?v=00de84a0"></script>
<script src="atencion-gate.js?v=87a95049"></script>
<script src="atencion-admin.js?v=4a6951b6"></script>
</body>
</html>
