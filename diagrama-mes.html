function saldoNote(l){

  var cu=cupoOf(who)[kd]; if(cu==null) return {t:'',x:false};
  var tk=balanceFor(who)[kd], rest=cu-tk;
  return {t:' Saldo de '+(kd==='vac'?'vacaciones':'licencia profiláctica')+': '+tk+' de '+cu+' días tomados · '+(rest>=0?'restan '+rest+'.':'excede en '+(-rest)+' día'+(rest===-1?'':'s')+'.'), x:rest<0};
}

function leavesForMonth(){
  /* licencias que abarcan el mes mostrado (sin importar en qué mes se cargaron) + las cargadas en este mes */
  var first=S.year+'-'+pad(S.month)+'-01', last=S.year+'-'+pad(S.month)+'-'+pad(dim()), k=mk(), out=[];

/* ---------- licencias → cronograma ---------- */
function parseISO(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function mkOf(dt){return dt.getFullYear()+'-'+pad(dt.getMonth()+1)}
function cellAt(k,pid,d){var m=S.cells[k]; return (m&&m[pid]&&m[pid][d])||null}
function putAt(k,pid,d,v){S.cells[k]=S.cells[k]||{}; var r=S.cells[k][pid]=S.cells[k][pid]||{}; if(v) r[d]=v; else delete r[d]}
function findPerson(name){
  name=(name||'').trim().toLowerCase(); if(!name) return null;
  for(var i=0;i<S.people.length;i++) if(S.people[i].name.trim().toLowerCase()===name) return S.people[i];
  return null;
}
function undoLeave(l){
  (l.ap||[]).slice().reverse().forEach(function(a){
    var cur=cellAt(a.k,a.p,a.d);
    if(cur&&cur.c===a.s.c&&(cur.m||'')===(a.s.m||'')) putAt(a.k,a.p,a.d,a.prev);
  });
  l.ap=[];
}
function applyLeave(l){
  undoLeave(l); l.res=''; l.warnRes=0;
  var d1=parseISO(l.desde), d2=parseISO(l.hasta), who=findPerson(l.who);
  if(!(l.who||'').trim()||!d1||!d2){l.res='Complete técnico, «Desde» y «Hasta» para reflejar la licencia en el cronograma.'; return}
  if(!who){l.res='No se encontró a «'+l.who+'» en el cronograma. Elíjalo de la lista de técnicos.'; return}
  if(d2<d1){l.res='La fecha «Hasta» es anterior a «Desde».'; return}
  var rname=(l.rep||'').trim(), rp=findPerson(rname), extra='';
  if(rname&&!rp){
    var pi=-1; S.pool.forEach(function(n,i){if(n.trim().toLowerCase()===rname.toLowerCase()) pi=i});
    if(pi>=0){var nm=S.pool.splice(pi,1)[0]; rp={id:uid(),name:nm,g:'sup'}; S.people.push(rp); extra=' «'+nm+'» se incorporó al cronograma como suplente.'}
    else extra=' No se encontró al reemplazante «'+rname+'» en el cronograma: no se trasladaron turnos.';
  }
  if(rp&&rp.id===who.id) rp=null;
  var nL=0, moved=0, noShift=0, conf=[], dt=new Date(d1), guard=0, mark=(l.est==='pend'?'pend':'ok');
  while(dt<=d2&&guard++<400){
    var k=mkOf(dt), d=dt.getDate(), prev=cellAt(k,who.id,d), pv=prev?{c:prev.c,m:prev.m||''}:null;
    var work=!!(pv&&/^[MTND]$/.test(pv.c)&&pv.m!=='no');
    l.ap.push({k:k,p:who.id,d:d,prev:pv,s:{c:'L',m:''}}); putAt(k,who.id,d,{c:'L',m:''}); nL++;
    if(work){
      if(rp){
        if(cellAt(k,rp.id,d)) conf.push(d+'/'+(dt.getMonth()+1));
        else{var s={c:pv.c,m:mark}; l.ap.push({k:k,p:rp.id,d:d,prev:null,s:s}); putAt(k,rp.id,d,{c:s.c,m:s.m}); moved++}
      }
    } else noShift++;
    dt.setDate(dt.getDate()+1);
  }
  var msg='Cronograma actualizado: '+nL+' día'+(nL===1?'':'s')+' con licencia («L»).';
  if(rp) msg+=' '+rp.name+' asignado/a en '+moved+' turno'+(moved===1?'':'s')+' de '+who.name+(/\.$/.test(who.name)?'':'.');
  if(rp&&noShift) msg+=' En '+noShift+' día'+(noShift===1?'':'s')+' el técnico no tenía turno cargado, por lo que no hay nada que trasladar.';
  if(conf.length) msg+=' No se pudo cubrir '+conf.join(', ')+' porque el reemplazante ya tiene una asignación esos días.';
  l.res=msg+extra;
  l.res+=saldoNote(l).t;
  if(conf.length||extra.indexOf('No se encontró')>=0||(rp&&noShift&&!moved)) l.warnRes=1;
}
function reapplyLeaves(){
  Object.keys(S.leaves).forEach(function(m){(S.leaves[m]||[]).forEach(function(l){if((l.who||'').trim()&&l.desde&&l.hasta) applyLeave(l)})});

  var name=(p.name||'').trim().toLowerCase(), r={vac:0,prof:0,otra:0,pend:{vac:0,prof:0,otra:0}};
  allLeaves().forEach(function(x){
    var l=x.l; if((l.who||'').trim().toLowerCase()!==name) return;

  });

function cupoOf(p){
  var c=p.cupo;
  if(!c&&p.cupos){ /* datos de una versión anterior: se toma el último año cargado */
    var ys=Object.keys(p.cupos).map(Number).sort(function(a,b){return b-a}); c={};
    ['vac','prof'].forEach(function(f){for(var i=0;i<ys.length;i++){var v=p.cupos[ys[i]][f]; if(v!==''&&v!=null){c[f]=v; break}}});
  }

  return out;
}

    '<div id="balt"></div>'+
    '<div class="acts" style="margin-top:14px"><button class="btn" data-close="1">Cerrar</button><button class="btn pri" id="balx">Exportar a Excel</button></div>');

      '<th class="g">Corresp.</th><th>Tomadas</th><th>Restan</th><th class="g">Corresp.</th><th>Tomadas</th><th>Restan</th></tr></thead><tbody>';

      var b=balanceFor(p), c=cupoOf(p);

      h+='<tr data-pid="'+p.id+'"><td>'+esc(p.name)+'</td><td class="b n">'+inp('vac')+'</td><td class="n">'+tk('vac')+'</td><td class="n rvr">'+restanHTML(c.vac,b.vac)+'</td>'+
        '<td class="b n">'+inp('prof')+'</td><td class="n">'+tk('prof')+'</td><td class="n rpr">'+restanHTML(c.prof,b.prof)+'</td><td class="b n">'+tk('otra')+'</td>'+
        '<td><button class="btn sm" data-det="'+p.id+'">Ver detalle</button></td></tr>';
    });

  draw();
  ov.addEventListener('input',function(e){

    var pp=S.people.filter(function(x){return x.id===t.dataset.pid})[0]; if(!pp) return;
    if(!pp.cupo){var cc=cupoOf(pp); pp.cupo={vac:cc.vac==null?'':cc.vac,prof:cc.prof==null?'':cc.prof}} pp.cupo[t.dataset.f]=(t.value===''?'':+t.value); persist();
    refreshLeaveNotes(); var c=cupoOf(pp), b=balanceFor(pp), tr=t.closest('tr');

  });
  ov.addEventListener('click',function(e){
    var t=e.target;
    if(t.dataset&&t.dataset.det){var pp=S.people.filter(function(x){return x.id===t.dataset.det})[0]; ov.querySelector('[data-close]').click(); if(pp) regDialog({who:pp.name.trim()}); return}
    if(t.id==='balx'){
      var q=function(v){v=String(v==null?'':v); return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}, rows=[];

/* ---------- registro de licencias ---------- */
function allLeaves(){
  var out=[]; Object.keys(S.leaves).forEach(function(k){(S.leaves[k]||[]).forEach(function(l){out.push({l:l,k:k})})});
  out.sort(function(a,b){var x=a.l.desde||'9999',y=b.l.desde||'9999'; return x<y?-1:x>y?1:0});
  return out;
}
function regCount(){return allLeaves().length}
function updRegBadge(){var n=regCount(); document.querySelectorAll('.regn').forEach(function(e){e.textContent='('+n+')'})}
function fmtD(s){var d=parseISO(s); return d?pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear():'—'}
function leaveDays(l){
  var a=parseISO(l.desde), b=parseISO(l.hasta); if(!a||!b||b<a) return 0;
  return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000)+1;
}
function regFiltered(f){
  return allLeaves().filter(function(x){
    var l=x.l; if(f.who&&(l.who||'').trim()!==f.who) return false;
    if(f.year&&(l.desde||'').slice(0,4)!==f.year&&(l.hasta||'').slice(0,4)!==f.year) return false;
    if(f.est==='conf'&&!l.conf) return false; if(f.est==='pend'&&l.conf) return false;
    return true;
  });
}
function regSummary(list){
  var m={}, order=[]; list.forEach(function(x){var w=(x.l.who||'').trim()||'(sin técnico)'; if(!m[w]){m[w]={n:0,d:0}; order.push(w)} m[w].n++; m[w].d+=leaveDays(x.l)});
  return order.sort().map(function(w){return {who:w,n:m[w].n,d:m[w].d}});
}
function regCSV(f){
  var q=function(v){v=String(v==null?'':v); return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}, rows=[], list=regFiltered(f), tot=0;
  rows.push(['FUESMEN · Servicio de Imágenes del Hospital Italiano']); rows.push(['Registro de licencias del personal técnico']);
  rows.push(['Filtro',(f.who||'Todos los técnicos')+' · '+(f.year||'Todos los años')+' · '+({conf:'Confirmadas',pend:'Pendientes de confirmar'}[f.est]||'Todos los estados')]); rows.push([]);
  rows.push(['Técnico','Tipo de licencia','Desde','Hasta','Días','Reemplazante','Estado del reemplazo','Estado de la licencia','Fecha de confirmación','Observaciones']);
  list.forEach(function(x){var l=x.l, d=leaveDays(l); tot+=d; rows.push([l.who,l.tipo,fmtD(l.desde),fmtD(l.hasta),d||'',l.rep,l.rep?(l.est==='pend'?'A confirmar':'Confirmado'):'',l.conf?'Confirmada':'Pendiente',l.conf?fmtD(l.confAt):'',l.hor])});
  rows.push([]); rows.push(['Total',list.length+' licencias','','',tot]); rows.push([]);
  rows.push(['Resumen por técnico','Licencias','Días']); regSummary(list).forEach(function(s){rows.push([s.who,s.n,s.d])});
  dl('registro-licencias-imagenes.csv','text/csv;charset=utf-8','\ufeff'+rows.map(function(r){return r.map(q).join(';')}).join('\r\n'));
}

    list.forEach(function(x){

    });
    h+='</tbody></table></div><p style="margin:12px 0 8px"><b>'+list.length+' licencia'+(list.length===1?'':'s')+' · '+tot+' día'+(tot===1?'':'s')+' en total'+(function(){var n=list.filter(function(x){return !x.l.conf}).length; return n?' · <span style="color:var(--amber)">'+n+' pendiente'+(n===1?'':'s')+' de confirmar</span>':' · todas confirmadas'})()+'</b></p><div>'+
      regSummary(list).map(function(s){return '<span class="rchip">'+esc(s.who)+' · '+s.n+' licencia'+(s.n===1?'':'s')+' · '+s.d+' día'+(s.d===1?'':'s')+'</span>'}).join('')+'</div>';
    ov.querySelector('#regt').innerHTML=h;
  }
  ov.addEventListener('change',function(e){if(e.target.id==='regw') f.who=e.target.value; else if(e.target.id==='regy') f.year=e.target.value; else if(e.target.id==='regs') f.est=e.target.value; else return; draw()});
  ov.addEventListener('click',function(e){

    if(t.id==='regb'){ov.querySelector('[data-close]').click(); balDialog(); return}
    if(t.dataset&&t.dataset.k){
      var k=t.dataset.k, id=t.dataset.id; ov.querySelector('[data-close]').click();
      S.year=+k.slice(0,4); S.month=+k.slice(5); render(); persist();

    }

function uid(){return 'x'+Math.random().toString(36).slice(2,8)}
function dl(name,mime,text){
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:mime})); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ═════ Guardado compartido en Lumen (Supabase · img_diagrama) ═════
   Se usa el cliente de la página que contiene este diagrama (imagenes.html).
   Cada cambio se guarda en la base con control de versión: si otra persona guardó antes,
   se carga su versión y se avisa. Sin permiso de edición, el diagrama queda en solo lectura. */
var DOC='tecnicos';
function rpcRemoto(fn,args){
  var P=window.parent;
  if(P&&P!==window&&typeof P.sbRpc==='function') return P.sbRpc(fn,args);
  if(typeof window.sbRpc==='function') return window.sbRpc(fn,args);
  return Promise.reject(new Error('SIN_CLIENTE'));
}
function tomarRemoto(d){ var seed=JSON.parse(document.getElementById('seed').textContent); d.groups=seed.groups; d.year=S.year; d.month=S.month; return d; }
function soloLectura(){
  if(REM.data){ S=tomarRemoto(JSON.parse(JSON.stringify(REM.data))); lastSnap=snapJSON(); render(); }
  stat('Solo lectura: tu usuario puede ver el diagrama pero no modificarlo.');
}
function remotoEncolar(){
  if(!REM.ok) return;
  if(!REM.edit){ soloLectura(); return; }
  clearTimeout(REM.timer); stat('Guardando…');
  REM.timer=setTimeout(remotoEnviar,900);
}
function limpio(){ var o=JSON.parse(JSON.stringify(S)); delete o.focus; return o; }
function remotoEnviar(){
  if(REM.enviando){ REM.otra=true; return; }
  REM.enviando=true;
  var dato=limpio();
  rpcRemoto('img_diagrama_guardar',{p_doc:DOC,p_data:dato,p_version:REM.ver}).then(function(r){
    REM.enviando=false;
    if(r&&r.ok){ REM.ver=r.version; REM.data=dato; stat('Guardado en Lumen · '+hhmm()+' · lo ven todos los que tienen acceso'); }
    else if(r&&r.error==='CONFLICTO'){ remotoLeer(true).then(function(){ stat('⚠ Otra persona guardó cambios antes: se cargó su versión. Revisá y repetí lo que falte.'); }); }
    else if(r&&r.error==='SIN_PERMISO'){ REM.edit=false; soloLectura(); }
    else stat('No se pudo guardar en Lumen ('+((r&&r.error)||'error')+'). Los cambios quedaron en este navegador.');
    if(REM.otra){ REM.otra=false; remotoEncolar(); }
  },function(e){ REM.enviando=false; stat('Sin conexión con Lumen: los cambios quedaron en este navegador y se reintentan solos.'); clearTimeout(REM.timer); REM.timer=setTimeout(remotoEnviar,8000); });
}
function remotoLeer(forzar){
  return rpcRemoto('img_diagrama_leer',{p_doc:DOC}).then(function(r){
    if(!r||!r.ok){ stat('No se pudo leer el diagrama de Lumen ('+((r&&r.error)||'error')+'). Se muestra la copia de este navegador.'); return; }
    REM.ok=true; REM.edit=!!r.puede_editar;
    if(r.existe){
      if(forzar||r.version!==REM.ver){
        REM.ver=r.version; REM.data=r.data;
        S=tomarRemoto(JSON.parse(JSON.stringify(r.data))); lastSnap=snapJSON(); U=[]; R=[]; updUndoUI(); render();
        try{localStorage.setItem('diagrama:'+S.docId,JSON.stringify(S))}catch(e){}
      }
      stat(REM.edit?'Conectado a Lumen · los cambios se guardan para todos':'Solo lectura: tu usuario puede ver el diagrama pero no modificarlo.');
    }else if(REM.edit){
      REM.ver=null; remotoEnviar();   // primera vez: sube lo que hay (copia de este navegador o datos iniciales)
    }else stat('Todavía no hay un diagrama guardado en Lumen.');
  },function(){ stat('Sin conexión con Lumen: se muestra la copia de este navegador.'); });
}
remotoLeer(false);
/* refresco: si otra persona guardó y acá no hay cambios en curso, se trae su versión */
setInterval(function(){ if(document.visibilityState==='visible'&&!REM.enviando&&!pend&&REM.ok) remotoLeer(false); },30000);
/* altura para el iframe contenedor */
function avisarAltura(){ try{ if(window.parent!==window) window.parent.postMessage({diagramaAltura:document.documentElement.scrollHeight},'*'); }catch(e){} }
new MutationObserver(avisarAltura).observe(document.body,{childList:true,subtree:true,attributes:true}); window.addEventListener('resize',avisarAltura); setTimeout(avisarAltura,300);
})();
</script>
