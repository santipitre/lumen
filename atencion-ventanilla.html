<!DOCTYPE html>
<html lang="es-AR">
<head>
<script>
/* Lumen Auth Gate · Ventanilla: sesión de Lumen (8 h) con cuenta Auth; el rol de atención lo valida atencion-gate.js */
(function(){
  try{
    var s=JSON.parse(localStorage.getItem('spcd_session'));
    if(!s||!s.user||!(Date.now()-s.ts<8*60*60*1000)||!s.user.auth_user_id){ location.replace('app.html?screen=login'); }
  }catch(e){ location.replace('app.html?screen=login'); }
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070D1F">
<meta name="robots" content="noindex, nofollow">
<title>Ventanilla · Turnos · Lumen</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="atencion-ventanilla.css?v=c82fbac2">
<link rel="stylesheet" href="atencion-comun.css?v=103466a6">
</head>
<body>

<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#1d3a5f"/><path d="M13 9v20h13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="27" cy="12" r="4.2" fill="#c8962e"/></svg>
    <div><div class="t1">Ventanilla · Turnos</div><div class="t2">Lumen · Diagnóstico por Imágenes</div></div>
  </div>
  <div class="spacer"></div>
  <div class="stat" id="stat" aria-live="polite"></div>
  <button class="puesto" id="btnPuesto" aria-haspopup="dialog" aria-label="Cambiar de ventanilla"><span class="pl">Estás en</span><b id="puestoTxt">–</b><span class="pc">Cambiar</span></button>
  <div class="clock" id="clock"></div>
  <div class="mode live" id="modeBadge" role="status"><i></i><span>En línea</span></div>
</header>

<main>
  <section class="calling" aria-label="Llamando ahora">
    <h2>Llamando ahora</h2>
    <div class="callist" id="llamando"></div>
  </section>

  <section class="queue" aria-label="En espera">
    <div class="filtros" id="filtros" role="group" aria-label="Filtrar por letra"></div>
    <div class="thead" aria-hidden="true"><span>Número</span><span>Llegada</span><span>Motivo</span><span>Observación</span><span></span></div>
    <div class="rows" id="rows" aria-live="polite"></div>
  </section>
</main>

<div class="ov" id="puestoOv" hidden>
  <div class="pbox" role="dialog" aria-modal="true" aria-labelledby="puestoTitle">
    <h3 id="puestoTitle">¿En qué ventanilla estás?</h3>
    <p>Cuando llames a un número, se va a mostrar «Ventanilla N» para que el paciente sepa adónde ir.</p>
    <div class="pgrid" id="puestoGrid"></div>
    <div class="btnrow"><button class="btn ghost" id="puestoCancel" hidden>Cancelar</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="spcd-supabase.js?v=4420ca43"></script>
<script src="atencion-cola.js?v=00de84a0"></script>
<script src="atencion-gate.js?v=87a95049"></script>
<script src="atencion-ventanilla.js?v=8e90c3e3"></script>
</body>
</html>
