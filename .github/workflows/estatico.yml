# Chequeos estáticos de Lumen: sin navegador, sin secretos, sin datos reales.
# Avisa (check rojo en GitHub) si alguien: saca un SRI, deja un CDN sin versión fija,
# deja assets con ?v= desfasado, rompe la sintaxis de un script, o agrega HTML dinámico
# sin escapar. No bloquea el deploy de Pages: sólo avisa.
name: Chequeos estaticos
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  estatico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Chequeos estáticos (python + node ya vienen en el runner)
        run: python3 tools/check_static.py
